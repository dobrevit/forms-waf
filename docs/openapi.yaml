openapi: 3.0.3
info:
  title: Forms WAF Admin API
  version: "1.0.0"
  description: |
    Contract for the Admin API served on port 8082.

    This exists because the hand-maintained TypeScript client drifted from the
    backend and three pages were silently non-functional as a result: the timing
    config page wrote min_time_seconds/no_cookie_score while the backend reads
    min_time_block/score_no_cookie, the routing page bound a toggle to a
    haproxy_ssl field that does not exist, and the vhost form wrote an
    `exclusions` array instead of excluded_blocked/excluded_flagged. Every one
    type-checked, because the types were written by hand to match the code
    rather than the server.

    A spec alone would drift the same way, so scripts/check-api-contract.py
    validates these schemas against a *live* server. The spec is only as good as
    that check, and the check is what makes it true.

    Coverage is deliberately partial: the endpoints below are the ones whose
    shapes have been verified against a running instance. Extend it by adding a
    path plus a schema and the checker picks it up with no further wiring.

servers:
  - url: http://localhost:8082/api
    description: Admin API (compose)

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: waf_admin_session

  schemas:
    Thresholds:
      type: object
      required: [spam_score_block, spam_score_flag, hash_count_block, ip_rate_limit, ip_daily_limit]
      properties:
        spam_score_block:     { type: integer, description: Score at which a request is blocked }
        spam_score_flag:      { type: integer, description: Score at which a request is flagged }
        hash_count_block:     { type: integer }
        hash_unique_ips_block: { type: integer }
        ip_rate_limit:        { type: integer }
        ip_daily_limit:       { type: integer }
        fingerprint_rate_limit:  { type: integer }
        ip_spam_score_threshold: { type: integer }
        expose_waf_headers:      { type: boolean }
        rate_limiting_enabled:   { type: boolean }

    GlobalRouting:
      type: object
      required: [haproxy_upstream]
      properties:
        haproxy_upstream:
          type: string
          description: HTTP upstream address. Note the port; HAProxy binds 8080.
        haproxy_upstream_ssl:
          type: string
        upstream_ssl:
          type: boolean
          description: |
            Use the SSL upstream address. There is no `haproxy_ssl` field --
            the admin UI bound a toggle to that name and it silently did nothing.
        haproxy_timeout:
          type: integer

    TimingTokenConfig:
      type: object
      required: [enabled, cookie_name, min_time_block, min_time_flag, score_no_cookie, score_too_fast, score_suspicious]
      properties:
        enabled:          { type: boolean }
        cookie_name:      { type: string }
        cookie_ttl:       { type: integer }
        min_time_block:
          type: integer
          description: Seconds below which a submission is blocked. NOT min_time_seconds.
        min_time_flag:
          type: integer
          description: Seconds below which a submission is flagged. NOT suspicious_time_seconds.
        score_no_cookie:
          type: integer
          description: Added when no timing cookie is present. NOT no_cookie_score.
        score_too_fast:
          type: integer
          description: NOT too_fast_score.
        score_suspicious:
          type: integer
          description: NOT suspicious_score.
        path_match_mode:  { type: string }
        apply_to_methods: { type: array, items: { type: string } }
        set_on_methods:   { type: array, items: { type: string } }

    SlackConfig:
      type: object
      required: [enabled, events, update_interval, resolution_threshold]
      properties:
        enabled:          { type: boolean }
        webhook_url:
          type: string
          description: Masked as "***" on read; submit the mask unchanged to keep the stored value.
        webhook_url_set:  { type: boolean }
        channel:          { type: string }
        update_interval:      { type: integer }
        resolution_threshold: { type: integer }
        events:           { type: array, items: { type: string } }
        mention_users:    { type: array, items: { type: string } }
        mention_on_high_severity: { type: boolean }
        severity_thresholds:
          type: object
          properties:
            high_event_count: { type: integer }
            high_event_rate:  { type: integer }

    DecisionTraceEntry:
      type: object
      properties:
        node:    { type: string }
        defense: { type: string, description: The mechanism, e.g. keyword_filter }
        profile: { type: string }
        score:   { type: integer, description: What this mechanism contributed }
        blocked: { type: boolean }
        flags:   { type: array, items: { type: string } }
        suppressed:
          type: array
          items: { type: string }
          description: >
            Detections this mechanism raised that a suppression removed. Present
            so "fired but suppressed" is distinguishable from "never fired".

    DecisionRetention:
      type: object
      properties:
        enabled:     { type: boolean }
        max_records: { type: integer }
        ttl_seconds: { type: integer }
        min_score:
          type: integer
          description: Allowed requests below this score are not recorded.

    Decision:
      type: object
      required: [ts, vhost_id, endpoint_id, action, score]
      properties:
        ts:          { type: integer }
        request_id:  { type: string, description: Matches the X-WAF-Request-Id response header }
        vhost_id:    { type: string }
        endpoint_id: { type: string }
        client_ip:   { type: string }
        host:        { type: string }
        path:        { type: string }
        method:      { type: string }
        user_agent:  { type: string }
        action:
          type: string
          enum: [blocked, allowed, challenged, tarpit, would_block]
          description: >
            What happened, taken from the response rather than from what the
            pipeline intended: monitoring mode records would_block with status 200.
        status:       { type: integer }
        mode:         { type: string }
        score:        { type: integer }
        block_reason: { type: string }
        blocked_by:   { type: array, items: { type: string } }
        flags:        { type: array, items: { type: string } }
        trace:
          type: array
          items: { $ref: "#/components/schemas/DecisionTraceEntry" }
        traced_score:
          type: integer
          description: Sum of the trace entries.
        unattributed_score:
          type: integer
          description: >
            score minus traced_score. Should be 0. Non-zero means some scoring
            path is not represented in the trace, so the breakdown is incomplete
            -- reported rather than assumed, because that has happened.

    Suppression:
      type: object
      required: [id, scope_type, flag]
      properties:
        id:
          type: string
          description: Digest of scope and flag, so adding the same one twice is idempotent.
        scope_type: { type: string, enum: [global, vhost, endpoint] }
        scope_id:
          type: string
          description: Absent for global scope; the vhost or endpoint id otherwise.
        flag:
          type: string
          description: Exact detection flag, or a trailing "*" to cover a family (kw:*).
        reason:     { type: string }
        created_at: { type: integer }
        created_by: { type: string }

    SuppressionCreated:
      type: object
      required: [suppression, created]
      properties:
        suppression: { $ref: "#/components/schemas/Suppression" }
        created:
          type: boolean
          description: False when the suppression already existed and was updated.

    ShadowDecision:
      type: object
      required: [ts, vhost_id, endpoint_id, score]
      properties:
        ts:          { type: integer, description: Unix time the decision was made }
        vhost_id:    { type: string }
        endpoint_id: { type: string }
        client_ip:   { type: string }
        host:        { type: string }
        path:        { type: string }
        method:      { type: string }
        score:       { type: integer }
        blocked_by:  { type: array, items: { type: string } }
        flags:       { type: array, items: { type: string } }

    ShadowCount:
      type: object
      required: [name, count]
      properties:
        name:  { type: string }
        count: { type: integer }

    ShadowSummary:
      type: object
      required: [would_block_total, dropped_total, retained_decisions, top_rules, top_flags, scopes]
      properties:
        would_block_total: { type: integer }
        dropped_total:
          type: integer
          description: >
            Records lost to the recorder's buffer cap. Non-zero means the sample
            is incomplete and the counts understate reality.
        retained_decisions: { type: integer }
        top_rules: { type: array, items: { $ref: "#/components/schemas/ShadowCount" } }
        top_flags:
          type: array
          description: Detection-level attribution; this is what identifies a rule to suppress.
          items: { $ref: "#/components/schemas/ShadowCount" }
        scopes:
          type: array
          items:
            type: object
            required: [vhost_id, endpoint_id, would_block_count]
            properties:
              vhost_id:          { type: string }
              endpoint_id:       { type: string }
              would_block_count: { type: integer }

    ShadowImpact:
      type: object
      required: [vhost_id, would_block_count, unique_client_ips, average_score, sample_incomplete]
      properties:
        vhost_id:          { type: string }
        endpoint_id:       { type: string }
        would_block_count: { type: integer }
        unique_client_ips: { type: integer }
        average_score:     { type: integer }
        window_start:      { type: integer }
        window_end:        { type: integer }
        sample_incomplete:
          type: boolean
          description: True when records were dropped, so this understates the impact.
        dropped_total:     { type: integer }
        top_rules:          { type: array, items: { $ref: "#/components/schemas/ShadowCount" } }
        top_flags:          { type: array, items: { $ref: "#/components/schemas/ShadowCount" } }
        affected_endpoints: { type: array, items: { $ref: "#/components/schemas/ShadowCount" } }

    WafStatus:
      type: object
      required: [redis_connected, blocked_hashes_count, whitelisted_ips_count, endpoints_count, vhosts_count]
      properties:
        redis_host:       { type: string }
        redis_port:       { type: integer }
        redis_connected:  { type: boolean }
        sync_interval:    { type: integer }
        blocked_hashes_count:  { type: integer }
        whitelisted_ips_count: { type: integer }
        endpoints_count:  { type: integer }
        vhosts_count:     { type: integer }

security:
  - sessionCookie: []

paths:
  /status:
    get:
      summary: WAF status
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WafStatus" }

  /config/thresholds:
    get:
      summary: Global thresholds
      responses:
        "200":
          description: Effective thresholds and defaults
          content:
            application/json:
              schema:
                type: object
                required: [thresholds]
                properties:
                  thresholds: { $ref: "#/components/schemas/Thresholds" }
                  defaults:   { type: object }

  /config/routing:
    get:
      summary: Global routing
      responses:
        "200":
          description: Effective routing and defaults
          content:
            application/json:
              schema:
                type: object
                required: [routing]
                properties:
                  routing:  { $ref: "#/components/schemas/GlobalRouting" }
                  defaults: { $ref: "#/components/schemas/GlobalRouting" }

  /timing/config:
    get:
      summary: Form timing token configuration
      responses:
        "200":
          description: Timing configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimingTokenConfig" }

  /slack/config:
    get:
      summary: Slack notification configuration
      responses:
        "200":
          description: Configuration, defaults and event availability
          content:
            application/json:
              schema:
                type: object
                required: [config, defaults]
                properties:
                  config:   { $ref: "#/components/schemas/SlackConfig" }
                  defaults: { $ref: "#/components/schemas/SlackConfig" }
                  emitted_events:     { type: array, items: { type: string } }
                  unavailable_events: { type: array, items: { type: string } }

  /decisions:
    get:
      summary: Search the enforcement decision log
      parameters:
        - { name: vhost_id,    in: query, schema: { type: string } }
        - { name: endpoint_id, in: query, schema: { type: string } }
        - { name: client_ip,   in: query, schema: { type: string } }
        - name: action
          in: query
          schema: { type: string, enum: [blocked, allowed, challenged, tarpit, would_block] }
        - { name: flag,      in: query, schema: { type: string } }
        - { name: path,      in: query, schema: { type: string, description: Substring match } }
        - { name: min_score, in: query, schema: { type: integer } }
        - { name: since,     in: query, schema: { type: integer, description: Unix time } }
        - { name: until,     in: query, schema: { type: integer, description: Unix time } }
        - { name: limit,     in: query, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          description: Matching decisions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [decisions, count]
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }
                  count:   { type: integer }
                  limit:   { type: integer }
                  scanned: { type: integer }
                  dropped_total:
                    type: integer
                    description: Non-zero means the buffer overflowed and the log has holes.
                  recorded_total: { type: integer }
                  retention: { $ref: "#/components/schemas/DecisionRetention" }
    delete:
      summary: Discard the decision log
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: boolean }

  /decisions/{request_id}:
    get:
      summary: Explain one decision
      x-contract-skip: >
        request_id is ephemeral, so there is no fixed example that returns 200.
        Exercised by the integration path instead.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The decision and its per-mechanism breakdown
          content:
            application/json:
              schema:
                type: object
                required: [decision]
                properties:
                  decision: { $ref: "#/components/schemas/Decision" }
        "404":
          description: >
            Not retained. The log is capped and time-limited, so this means the
            request aged out rather than that it never happened.

  /suppressions:
    get:
      summary: Detections that no longer count, and where
      responses:
        "200":
          description: Every suppression currently in force
          content:
            application/json:
              schema:
                type: object
                required: [suppressions, count]
                properties:
                  suppressions:
                    type: array
                    items: { $ref: "#/components/schemas/Suppression" }
                  count: { type: integer }
                  max:
                    type: integer
                    description: Ceiling on entries; this list is walked on every defense node.
    post:
      summary: Stop a detection counting for one scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flag]
              properties:
                flag:
                  type: string
                  maxLength: 120
                  description: >
                    Exact detection flag, or a trailing "*" for a family (kw:*).
                    This is the flag the mechanism emits, without the profile
                    prefix that appears on recorded shadow decisions.
                scope_type:
                  type: string
                  enum: [global, vhost, endpoint]
                  default: global
                scope_id:
                  type: string
                  description: Required unless scope_type is global.
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuppressionCreated" }
        "200":
          description: >
            Already present. The id is a digest of scope and flag, so re-adding
            the same suppression updates it rather than creating a duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuppressionCreated" }
        "400":
          description: >
            Invalid input. Includes a global "*", which would disable all
            detection and is refused deliberately.
    delete:
      summary: Remove every suppression
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: boolean }

  /suppressions/{id}:
    delete:
      summary: Remove one suppression
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted: { type: boolean }
                  id: { type: string }
        "404":
          description: No suppression with that id

  /shadow/summary:
    get:
      summary: What monitoring mode would have blocked
      responses:
        "200":
          description: Aggregate view over the retained window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowSummary" }

  /shadow/decisions:
    get:
      summary: Individual would-block decisions
      responses:
        "200":
          description: Recent decisions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [decisions, count]
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/ShadowDecision" }
                  count: { type: integer }
                  limit: { type: integer }

  /shadow/impact:
    get:
      summary: Pre-flight impact of promoting a scope to blocking
      x-contract-example-query: "vhost_id=_default"
      parameters:
        - name: vhost_id
          in: query
          required: true
          schema: { type: string }
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: What promoting this scope would have blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowImpact" }

  /keywords/blocked:
    get:
      summary: Blocked keywords
      responses:
        "200":
          description: Keyword list
          content:
            application/json:
              schema:
                type: object
                required: [keywords]
                properties:
                  keywords: { type: array, items: { type: string } }

  /vhosts:
    get:
      summary: Virtual hosts
      responses:
        "200":
          description: All vhosts visible to the session
          content:
            application/json:
              schema:
                type: object
                required: [vhosts, total]
                properties:
                  vhosts: { type: array, items: { type: object } }
                  total:  { type: integer }

  /endpoints:
    get:
      summary: Endpoints
      responses:
        "200":
          description: All endpoints visible to the session
          content:
            application/json:
              schema:
                type: object
                required: [endpoints, total]
                properties:
                  endpoints: { type: array, items: { type: object } }
                  total:     { type: integer }
